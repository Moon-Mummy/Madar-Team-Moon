<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Madar-Team-Moon — Open Moon Colony Sandbox</title>
<meta name="description" content="Madar-Team-Moon: a single-player, open Moon-colony learning sandbox. Explore the base, meet the crew bots and help with real-world-inspired lunar problems. No age gates, no accounts, no ads.">
<meta name="theme-color" content="#070d18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070d18'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23e9edf0'/%3E%3Cellipse cx='32' cy='32' rx='25' ry='9' fill='none' stroke='%2369d4e7' stroke-width='3.5' transform='rotate(-24 32 32)'/%3E%3Ccircle cx='53' cy='20' r='4' fill='%23f1c36d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="3D view of the Moon colony"></canvas>
<div id="labels" aria-hidden="true"></div>

<div id="hud" hidden>
  <header id="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><b>MADAR</b><i data-t="ui.team"></i></div>
    <div id="meters"></div>
    <div id="clock" class="chip"></div>
    <div class="topbtns">
      <button id="bSound" class="ib" type="button" aria-label="Sound"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4.5 9.5h3L12 6v12L7.5 14.5h-3z"/><path class="wave" d="M15.5 8.6a4.8 4.8 0 0 1 0 6.8"/><line class="slash" x1="4" y1="20" x2="20" y2="4"/></svg></button>
      <button id="bSet" class="ib" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.3"/><path d="M12 3.2v2.4M12 18.4v2.4M3.2 12h2.4M18.4 12h2.4M5.8 5.8l1.7 1.7M16.5 16.5l1.7 1.7M18.2 5.8l-1.7 1.7M7.5 16.5l-1.7 1.7"/></svg></button>
    </div>
  </header>

  <section id="obj" class="panel">
    <div class="eyebrow" data-t="ui.sandbox"></div>
    <h2 id="objT"></h2>
    <p id="objD"></p>
    <div class="row">
      <button id="bBoard" class="btn" type="button"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="5" y="4.2" width="14" height="16.8" rx="2"/><path d="M9 4.2V2.6h6v1.6M8.6 10.5h6.8M8.6 14.2h4.6"/></svg><span data-t="ui.board"></span><em id="badge" hidden></em></button>
      <button id="bJournal" class="btn ghost" type="button"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.4A2.2 2.2 0 0 1 7.2 3.2h12v17.6h-12A2.2 2.2 0 0 0 5 23z"/><path d="M9 8.4h6M9 12h4.4"/></svg><span data-t="ui.journal"></span></button>
      <button id="bGuide" class="btn ghost" type="button"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4a8.6 8.6 0 1 0 10.6 10.6z"/><path d="M17.6 4.4l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg><span data-t="ui.guide"></span></button>
    </div>
  </section>

  <aside id="side">
    <canvas id="map" width="176" height="176"></canvas>
    <div id="crew" class="panel"></div>
  </aside>

  <div id="caption" class="panel" hidden></div>
  <div id="prompt" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="help" data-t="ui.help"></div>

  <div id="stick" aria-hidden="true"><i></i></div>
  <button id="bJump" class="tbtn" type="button" aria-label="Jump">⤒</button>
  <button id="bAct" class="tbtn big" type="button" aria-label="Interact">E</button>
</div>

<div id="start">
  <div class="card">
    <div class="tag" data-t="ui.tag"></div>
    <h1><span class="logo" aria-hidden="true"></span><span>MADAR<small>TEAM · MOON</small></span></h1>
    <p class="sub" data-t="ui.intro"></p>
    <div class="suit"><span data-t="ui.suit"></span><div id="swatches"></div></div>
    <div class="row">
      <button id="bEnter" class="btn primary" type="button"></button>
      <button id="bNew" class="btn ghost" type="button" hidden data-t="ui.fresh"></button>
      <button id="bLang" class="btn ghost" type="button"></button>
    </div>
    <p class="foot" data-t="ui.foot"></p>
  </div>
</div>

<div id="modal" hidden><div id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="loading">MADAR · TEAM · MOON</div>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#070d18;color:#fff;font:18px system-ui;padding:24px;text-align:center">Madar-Team-Moon needs JavaScript and WebGL. Please enable JavaScript and reload.</div></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
